  generate_wrong_answer_5_2:
    agent: false
    description: Create the second plausible wrong answer for level 5.
    name: generate_wrong_answer_5_2
    nodes_depended_on:
    - compute_correct_answer_5
    nodes_dependent_on: []
    prompt: Given the correct answer, produce a second plausible but incorrect numeric

  generate_wrong_answer_2_2:
    agent: false
    description: Create the second plausible wrong answer for level 2.
    name: generate_wrong_answer_2_2
    nodes_depended_on:
    - compute_correct_answer_2
    nodes_dependent_on: []
    prompt: Given the correct answer, produce a second plausible but incorrect numeric

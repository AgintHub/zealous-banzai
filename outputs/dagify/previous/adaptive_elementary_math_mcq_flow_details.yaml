dag_type: plain_text
description: Generates a sequence of up‑to‑five multiple‑choice math questions for
  elementary students. Each question has one correct answer and three plausible wrong
  answers. After each answer the flow decides the next difficulty level (harder if
  correct, easier if incorrect) and presents the next question. All question generation
  for the five difficulty levels is done in parallel.
name: adaptive_elementary_math_mcq_flow
nodes:
  decide_lvl2:
    agent: false
    description: Select the difficulty level for the second question based on the
      result of eval_q1.
    name: decide_lvl2
    nodes_depended_on:
    - eval_q1
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q1. If true, set next_level = current_level
      + 1 (max 5). If false, set next_level = current_level - 1 (min 1). The current
      level for the first question is 1. Output a JSON object with field "next_level"
      containing the integer level (1‑5).
  decide_lvl3:
    agent: false
    description: Select the difficulty level for the third question based on eval_q2.
    name: decide_lvl3
    nodes_depended_on:
    - eval_q2
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q2. If true, increase the current
      level by 1 (capped at 5). If false, decrease the current level by 1 (floored
      at 1). The current level is the one used for the second question (the value
      from decide_lvl2). Output a JSON object with "next_level" set to the new integer
      (1‑5).
  decide_lvl4:
    agent: false
    description: Select the difficulty level for the fourth question based on eval_q3.
    name: decide_lvl4
    nodes_depended_on:
    - eval_q3
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q3. If true, increase the current
      level by 1 (max 5). If false, decrease the current level by 1 (min 1). The current
      level is the one used for the third question (value from decide_lvl3). Output
      a JSON object with "next_level" set to the new integer.
  decide_lvl5:
    agent: false
    description: Select the difficulty level for the fifth (final) question based
      on eval_q4.
    name: decide_lvl5
    nodes_depended_on:
    - eval_q4
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q4. If true, increase the current
      level by 1 (max 5). If false, decrease the current level by 1 (min 1). The current
      level is the one used for the fourth question (value from decide_lvl4). Output
      a JSON object with "next_level" set to the new integer.
  eval_q1:
    agent: false
    description: Evaluate the student's answer for the first question and output a
      correctness flag.
    name: eval_q1
    nodes_depended_on:
    - present_q1_lvl1
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A, B, C, or D) and the correct
      option identified in the prompt from present_q1_lvl1, output a JSON object with
      a single field "is_correct": true if the student''s choice matches the correct
      option, otherwise false.'
  eval_q2:
    agent: false
    description: Evaluate the student's answer for the second question and output
      a correctness flag.
    name: eval_q2
    nodes_depended_on:
    - present_q2_lvl1
    - present_q2_lvl2
    - present_q2_lvl3
    - present_q2_lvl4
    - present_q2_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from whichever present_q2_lvlX executed, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  eval_q3:
    agent: false
    description: Evaluate the student's answer for the third question and output a
      correctness flag.
    name: eval_q3
    nodes_depended_on:
    - present_q3_lvl1
    - present_q3_lvl2
    - present_q3_lvl3
    - present_q3_lvl4
    - present_q3_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from the executed present_q3_lvlX node, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  eval_q4:
    agent: false
    description: Evaluate the student's answer for the fourth question and output
      a correctness flag.
    name: eval_q4
    nodes_depended_on:
    - present_q4_lvl1
    - present_q4_lvl2
    - present_q4_lvl3
    - present_q4_lvl4
    - present_q4_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from the executed present_q4_lvlX node, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  eval_q5:
    agent: false
    description: Evaluate the student's answer for the final question and output a
      correctness flag.
    name: eval_q5
    nodes_depended_on:
    - present_q5_lvl1
    - present_q5_lvl2
    - present_q5_lvl3
    - present_q5_lvl4
    - present_q5_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from the executed present_q5_lvlX node, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  gen_q_lvl1:
    agent: false
    description: Create one elementary‑math multiple‑choice question suitable for
      a beginner (level 1).
    name: gen_q_lvl1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a single multiple‑choice math question for a beginner (level 1).
      Provide the question text, one correct answer, and three plausible incorrect
      answers. Return a JSON object with fields: "question", "correct_answer", "wrong_answers"
      (array of three strings).'
  gen_q_lvl2:
    agent: false
    description: Create one multiple‑choice question for a slightly harder beginner
      (level 2).
    name: gen_q_lvl2
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a single multiple‑choice math question for level 2 difficulty.
      Include the question, one correct answer, and three plausible wrong answers.
      Return a JSON object with fields: "question", "correct_answer", "wrong_answers".'
  gen_q_lvl3:
    agent: false
    description: Create one multiple‑choice question for a moderate difficulty (level 3).
    name: gen_q_lvl3
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a single multiple‑choice math question for level 3 difficulty.
      Include the question, one correct answer, and three plausible wrong answers.
      Return a JSON object with fields: "question", "correct_answer", "wrong_answers".'
  gen_q_lvl4:
    agent: false
    description: Create one multiple‑choice question for a high‑school‑approaching
      difficulty (level 4).
    name: gen_q_lvl4
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a single multiple‑choice math question for level 4 difficulty.
      Include the question, one correct answer, and three plausible wrong answers.
      Return a JSON object with fields: "question", "correct_answer", "wrong_answers".'
  gen_q_lvl5:
    agent: false
    description: Create one multiple‑choice question for the hardest elementary level
      (level 5).
    name: gen_q_lvl5
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a single multiple‑choice math question for level 5 difficulty.
      Include the question, one correct answer, and three plausible wrong answers.
      Return a JSON object with fields: "question", "correct_answer", "wrong_answers".'
  init_flow:
    agent: false
    description: Start node that initializes the adaptive session (no action needed).
    name: init_flow
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Begin the adaptive quiz session. No output required; this node only signals
      the start of the workflow.
  present_q1_lvl1:
    agent: false
    description: Present the level‑1 question generated for step 1 to the student.
    name: present_q1_lvl1
    nodes_depended_on:
    - init_flow
    - gen_q_lvl1
    nodes_dependent_on: []
    prompt: 'Take the JSON output from gen_q_lvl1 and format it as a multiple‑choice
      prompt:


      Question: <question>

      A) <option1>

      B) <option2>

      C) <option3>

      D) <option4>


      Place the correct answer randomly among the four options. Output the formatted
      prompt and indicate which option (A‑D) is correct (but do not reveal it to the
      student).'
  present_q2_lvl1:
    agent: false
    description: Present a level‑1 question for step 2 (used if decide_lvl2 chose
      level 1).
    name: present_q2_lvl1
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl1
    nodes_dependent_on: []
    prompt: If decide_lvl2's next_level equals 1, take the JSON from gen_q_lvl1 and
      format it as a multiple‑choice prompt exactly as in present_q1_lvl1. Output
      the formatted prompt and the hidden correct option label.
  present_q2_lvl2:
    agent: false
    description: Present a level‑2 question for step 2 (used if decide_lvl2 chose
      level 2).
    name: present_q2_lvl2
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl2
    nodes_dependent_on: []
    prompt: If decide_lvl2's next_level equals 2, format the question from gen_q_lvl2
      as a multiple‑choice prompt (A‑D) with the correct answer randomly placed. Output
      the prompt and the hidden correct option label.
  present_q2_lvl3:
    agent: false
    description: Present a level‑3 question for step 2 (used if decide_lvl2 chose
      level 3).
    name: present_q2_lvl3
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl3
    nodes_dependent_on: []
    prompt: If decide_lvl2's next_level equals 3, format the question from gen_q_lvl3

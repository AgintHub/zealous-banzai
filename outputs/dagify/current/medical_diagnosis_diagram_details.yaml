dag_type: plain_text
description: A clinical workflow for diagnosing medical conditions through concurrent
  data collection, hypothesis generation, diagnostic testing, and pathway categorization
  using structured medical reasoning
name: medical_diagnosis_diagram
nodes:
  analyze_laboratory_results:
    agent: false
    description: Interpret biochemical/pathological findings
    name: analyze_laboratory_results
    nodes_depended_on:
    - order_laboratory_tests
    nodes_dependent_on: []
    prompt: 'Create structured lab analysis: 1) Compare values to reference ranges,
      2) Identify significant deviations, 3) Correlate with hypothesis. Highlight
      delta check values and critical thresholds.'
  categorize_diagnostic_pathway:
    agent: false
    description: Classify the overall diagnostic approach based on data sources
    name: categorize_diagnostic_pathway
    nodes_depended_on:
    - update_differential_diagnosis
    nodes_dependent_on: []
    prompt: 'Assign pathway classification: 1) Lab-test driven, 2) Imaging-centric,
      3) Multimodal evidence. Document: 1) Test result consistency, 2) Diagnostic
      efficiency metrics, 3) Required follow-up categories.'
  categorize_initial_approach:
    agent: false
    description: Classify the initial diagnostic strategy based on hypothesis sources
    name: categorize_initial_approach
    nodes_depended_on:
    - merge_initial_hypotheses
    nodes_dependent_on: []
    prompt: 'Categorize the diagnostic approach as: 1) Symptom-driven, 2) History-pattern
      driven, 3) Mixed source. For each category, provide: 1) Justification, 2) Diagnostic
      pathway implications, 3) Required next steps.'
  collect_present_symptoms:
    agent: false
    description: Systematically record all active patient symptoms including duration,
      severity, and associated factors
    name: collect_present_symptoms
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'List all currently active symptoms the patient is reporting, including:
      1) Chief complaint, 2) Duration specifics, 3) Aggravating/alleviating factors,
      4) System-specific manifestations (e.g. cardiovascular, respiratory). Present
      as bullet list with detailed annotations.'
  compile_specialist_input:
    agent: false
    description: Aggregate subspecialty diagnostic insights
    name: compile_specialist_input
    nodes_depended_on:
    - prepare_specialist_referrals
    nodes_dependent_on: []
    prompt: 'Synthesize consultant responses: 1) Format as structured differential
      analysis, 2) Note diagnostic confidence levels, 3) Incorporate into overall
      pathway. Flag discordant opinions for resolution.'
  finalize_diagnostic_conclusion:
    agent: false
    description: Establish final clinical diagnosis with supporting pathways
    name: finalize_diagnostic_conclusion
    nodes_depended_on:
    - generate_diagnostic_summary
    - request_confirmatory_testing
    nodes_dependent_on: []
    prompt: 'Document final diagnosis: 1) ICD-10 code, 2) Diagnostic certainty level,
      3) Complete pathway with all categorizations completed at each stage. Include
      3-5 key diagnostic landmarks and timestamps.'
  gather_patient_history:
    agent: false
    description: Compile comprehensive medical history including prior diagnoses,
      medications, allergies, and socioeconomic factors
    name: gather_patient_history
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Create a structured 7-pillar medical history: 1) Past medical history,
      2) Medications, 3) Allergies, 4) Family history, 5) Social history, 6) Review
      of systems, 7) Psychosocial factors. Include timestamps and relevance rankings.'
  generate_diagnostic_summary:
    agent: false
    description: Create final diagnostic synopsis and management plan
    name: generate_diagnostic_summary
    nodes_depended_on:
    - update_differential_diagnosis
    - categorize_diagnostic_pathway
    nodes_dependent_on: []
    prompt: 'Produce concise diagnosis summary: 1) Probable condition with supporting
      evidence, 2) Alternative differentials with exclusion status, 3) Recommended
      treatments/procedures, 4) Risk stratification score.'
  generate_history_hypotheses:
    agent: false
    description: Create diagnostic hypotheses based on medical history patterns
    name: generate_history_hypotheses
    nodes_depended_on:
    - gather_patient_history
    nodes_dependent_on: []
    prompt: 'Generate 3-5 hypothesis from the medical history data focusing on: 1)
      Condition progression patterns, 2) Medication-allergy interactions, 3) Familial
      disease risks. Annotate with relevant diagnostic codes and risk factors.'
  generate_symptom_hypotheses:
    agent: false
    description: Derive initial differential diagnoses based on presenting symptoms
    name: generate_symptom_hypotheses
    nodes_depended_on:
    - collect_present_symptoms
    nodes_dependent_on: []
    prompt: 'Generate 3-5 potential medical conditions that best explain the listed
      symptoms using ICD-10 codes. Prioritize by: 1) Symptom specificity, 2) Prevalence
      in general population, 3) Urgency criteria. Include brief mechanistic rationales.'
  merge_initial_hypotheses:
    agent: false
    description: Combine and rank hypothesis from both symptom and history analysis
    name: merge_initial_hypotheses
    nodes_depended_on:
    - generate_symptom_hypotheses
    - generate_history_hypotheses
    nodes_dependent_on: []
    prompt: 'Merge the hypothesis lists from symptoms and history analyses. For each
      hypothesis: 1) Assign weighted probability score (1-10), 2) Flag overlapping
      patterns, 3) Identify unique differentiators. Present as prioritized list.'
  order_imaging_studies:
    agent: false
    description: Schedule anatomical/functional imaging procedures
    name: order_imaging_studies
    nodes_depended_on:
    - prioritize_diagnostic_tests
    nodes_dependent_on: []
    prompt: 'Select and sequence imaging modalities (X-ray/CT/MRI/US) based on: 1)
      Anatomical location of disease suspicion, 2) Contrast requirements, 3) Patient
      safety factors. Include radiation dose metrics and preparation instructions.'
  order_laboratory_tests:
    agent: false
    description: Execute blood/urine/bodily fluid testing protocols
    name: order_laboratory_tests
    nodes_depended_on:
    - prioritize_diagnostic_tests
    nodes_dependent_on: []
    prompt: 'Create lab work order: 1) List each test with CPT code, 2) Specify specimen
      types and collection requirements, 3) Define reference ranges. Include rapid
      testing protocols for urgent differentials.'
  prepare_specialist_referrals:
    agent: false
    description: Initiate subspecialty consultations
    name: prepare_specialist_referrals
    nodes_depended_on:
    - prioritize_diagnostic_tests
    nodes_dependent_on: []
    prompt: 'Generate referral pathway: 1) List required specialties by hypothesis,
      2) Include key diagnostic questions for each consultation, 3) Specify timing
      requirements. Flag cases requiring multidisciplinary boards.'
  prioritize_diagnostic_tests:
    agent: false
    description: Select first-tier diagnostic tests based on hypotheses
    name: prioritize_diagnostic_tests
    nodes_depended_on:
    - merge_initial_hypotheses
    nodes_dependent_on: []
    prompt: 'Based on the top 3 prioritized hypotheses: 1) Select 2-3 key diagnostic
      tests per hypothesis, 2) Rank by diagnostic yield, 3) Include cost-effectiveness
      ratio. Prioritize tests with highest specificity for rare conditions.'
  request_confirmatory_testing:
    agent: false
    description: Order definitive diagnostic procedures for top hypothesis
    name: request_confirmatory_testing
    nodes_depended_on:
    - generate_diagnostic_summary
    nodes_dependent_on: []
    prompt: 'Design confirmatory testing plan: 1) List gold-standard diagnostic tests,
      2) Sequence by invasiveness, 3) Establish decision thresholds. Include cost-benefit
      analysis for each proposed procedure.'
  review_imaging_findings:
    agent: false
    description: Assess anatomical/pathological imaging data
    name: review_imaging_findings
    nodes_depended_on:
    - order_imaging_studies
    nodes_dependent_on: []
    prompt: 'Generate imaging assessment report: 1) List abnormalities by anatomic
      location, 2) Grade severity scores, 3) Correlate with differential pathologies.
      Include comparison with prior imaging if available.'
  update_differential_diagnosis:
    agent: false
    description: Refine hypothesis based on diagnostic data
    name: update_differential_diagnosis
    nodes_depended_on:
    - analyze_laboratory_results
    - review_imaging_findings
    - compile_specialist_input
    nodes_dependent_on: []
    prompt: 'Re-evaluate differential diagnosis using objective test results to: 1)
      Promote supported hypotheses, 2) Deprioritize invalidated ones, 3) Add new differentials.
      Create decision tree for next steps.'

dag_type: plain_text
description: A fully atomic, branching workflow that generates elementary school math
  multiple‑choice questions, evaluates a student answer, and follows a correct or
  incorrect branch for each question.
name: adaptive_elementary_math_mcq_workflow
nodes:
  correct_feedback_1:
    agent: false
    description: Generate positive feedback when the answer to question 1 is correct.
    name: correct_feedback_1
    nodes_depended_on:
    - evaluate_answer_1
    nodes_dependent_on: []
    prompt: If the output of evaluate_answer_1 is "true", respond with a short encouraging
      message such as "Great job!". If the output is not "true", output nothing.
  correct_feedback_2:
    agent: false
    description: Provide encouraging feedback when the answer to question 2 is correct.
    name: correct_feedback_2
    nodes_depended_on:
    - evaluate_answer_2
    nodes_dependent_on: []
    prompt: If evaluate_answer_2 output is "true", reply with a brief positive message
      (e.g., "Well done!"). Otherwise output nothing.
  correct_feedback_3:
    agent: false
    description: Give positive feedback when the answer to question 3 is correct.
    name: correct_feedback_3
    nodes_depended_on:
    - evaluate_answer_3
    nodes_dependent_on: []
    prompt: If evaluate_answer_3 output is "true", output a brief congratulatory note
      (e.g., "Excellent!"). Otherwise output nothing.
  evaluate_answer_1:
    agent: false
    description: Compare a supplied student answer with the correct answer for question 1
      and output a Boolean flag.
    name: evaluate_answer_1
    nodes_depended_on:
    - generate_options_1
    nodes_dependent_on: []
    prompt: You are given the problem from generate_question_1, the four choices from
      generate_options_1, and a variable `student_answer` (one of A‑D). Determine
      whether the selected choice is the correct answer. Output "true" if correct,
      otherwise "false".
  evaluate_answer_2:
    agent: false
    description: Check the student’s answer for question 2 and output a Boolean flag.
    name: evaluate_answer_2
    nodes_depended_on:
    - generate_options_2
    nodes_dependent_on: []
    prompt: You receive the problem from generate_question_2, the options from generate_options_2,
      and a variable `student_answer` (A‑D). Return "true" if the selected choice
      is correct, otherwise "false".
  evaluate_answer_3:
    agent: false
    description: Check the student’s answer for question 3 and output a Boolean flag.
    name: evaluate_answer_3
    nodes_depended_on:
    - generate_options_3
    nodes_dependent_on: []
    prompt: You have the problem from generate_question_3, the options from generate_options_3,
      and a variable `student_answer` (A‑D). Return "true" if the selected choice
      is correct, otherwise "false".
  final_summary:
    agent: false
    description: Summarize the student's performance across all three questions.
    name: final_summary
    nodes_depended_on:
    - evaluate_answer_1
    - evaluate_answer_2
    - evaluate_answer_3
    nodes_dependent_on: []
    prompt: Based on the true/false outputs of evaluate_answer_1, evaluate_answer_2,
      and evaluate_answer_3, count how many were correct. Produce a short summary
      sentence such as "You answered 2 out of 3 questions correctly. Keep practicing!".
  generate_options_1:
    agent: false
    description: Produce four answer choices for question 1, one correct and three
      plausible distractors.
    name: generate_options_1
    nodes_depended_on:
    - generate_question_1
    nodes_dependent_on: []
    prompt: Given the problem from generate_question_1, compute the correct answer
      and create three incorrect but plausible numbers. Return a list of four choices
      in random order, labeling them A, B, C, D.
  generate_options_2:
    agent: false
    description: Produce four answer choices for question 2.
    name: generate_options_2
    nodes_depended_on:
    - generate_question_2
    nodes_dependent_on: []
    prompt: Given the problem from generate_question_2, compute the correct answer
      and three distractors. Return four choices labelled A‑D in random order.
  generate_options_3:
    agent: false
    description: Produce four answer choices for question 3.
    name: generate_options_3
    nodes_depended_on:
    - generate_question_3
    nodes_dependent_on: []
    prompt: Given the problem from generate_question_3, compute the correct answer
      and three distractors. Return four choices labelled A‑D in random order.
  generate_question_1:
    agent: false
    description: Create a single elementary math problem (addition or subtraction)
      suitable for a first‑grade student.
    name: generate_question_1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate one simple addition or subtraction problem involving two single‑digit
      numbers. Output only the problem text, e.g., "3 + 5 = ?".
  generate_question_2:
    agent: false
    description: Create the next math problem after question 1 regardless of the answer
      outcome.
    name: generate_question_2
    nodes_depended_on:
    - evaluate_answer_1
    nodes_dependent_on: []
    prompt: Generate a new elementary math problem (addition, subtraction, or simple
      multiplication) suitable for a second‑grade student. Output only the problem
      text.
  generate_question_3:
    agent: false
    description: Create a third math problem after question 2.
    name: generate_question_3
    nodes_depended_on:
    - evaluate_answer_2
    nodes_dependent_on: []
    prompt: Generate another elementary math problem (addition, subtraction, or simple
      division) suitable for a third‑grade student. Output only the problem text.
  incorrect_feedback_1:
    agent: false
    description: Generate constructive feedback when the answer to question 1 is incorrect.
    name: incorrect_feedback_1
    nodes_depended_on:
    - evaluate_answer_1
    nodes_dependent_on: []
    prompt: If the output of evaluate_answer_1 is "false", respond with a brief hint
      that leads the student to the correct solution, e.g., "Remember to count on
      your fingers.". If the output is not "false", output nothing.
  incorrect_feedback_2:
    agent: false
    description: Provide a hint when the answer to question 2 is incorrect.
    name: incorrect_feedback_2
    nodes_depended_on:
    - evaluate_answer_2
    nodes_dependent_on: []
    prompt: If evaluate_answer_2 output is "false", reply with a short hint relevant
      to the problem (e.g., "Try counting backwards."). Otherwise output nothing.
  incorrect_feedback_3:
    agent: false
    description: Give a hint when the answer to question 3 is incorrect.
    name: incorrect_feedback_3
    nodes_depended_on:
    - evaluate_answer_3
    nodes_dependent_on: []
    prompt: If evaluate_answer_3 output is "false", output a short instructional hint
      related to the problem. Otherwise output nothing.

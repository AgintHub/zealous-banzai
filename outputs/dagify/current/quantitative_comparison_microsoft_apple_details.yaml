dag_type: plain_text
description: A step‑by‑step workflow that retrieves Microsoft and Apple stock price
  data, cleans and merges it, computes returns, volatility, Sharpe ratios, correlation,
  and produces a comparative chart and summary report.
name: quantitative_comparison_microsoft_apple
nodes:
  calculate_daily_returns_apple:
    agent: false
    description: Compute daily returns for AAPL.
    name: calculate_daily_returns_apple
    nodes_depended_on:
    - merge_price_data
    nodes_dependent_on:
    - compute_correlation
    - compute_volatility_apple
    - compute_sharpe_apple
    prompt: 'From the merged CSV, compute daily log returns for AAPL: ln(Close_AAPL_t
      / Close_AAPL_{t-1}). Add a column Return_AAPL. Output the updated CSV.'
  calculate_daily_returns_microsoft:
    agent: false
    description: Compute daily returns for MSFT.
    name: calculate_daily_returns_microsoft
    nodes_depended_on:
    - merge_price_data
    nodes_dependent_on:
    - compute_correlation
    - compute_volatility_microsoft
    - compute_sharpe_microsoft
    prompt: 'From the merged CSV, compute daily log returns for MSFT: ln(Close_MSFT_t
      / Close_MSFT_{t-1}). Add a column Return_MSFT. Output the updated CSV.'
  clean_and_format_data_apple:
    agent: false
    description: Clean and format AAPL data.
    name: clean_and_format_data_apple
    nodes_depended_on:
    - retrieve_price_data_apple
    nodes_dependent_on:
    - merge_price_data
    prompt: Take the CSV from Apple retrieval. Drop rows with missing Close values,
      convert Date to ISO format, and sort by Date ascending. Output a clean CSV with
      columns Date and Close_AAPL.
  clean_and_format_data_microsoft:
    agent: false
    description: Clean and format MSFT data.
    name: clean_and_format_data_microsoft
    nodes_depended_on:
    - retrieve_price_data_microsoft
    nodes_dependent_on:
    - merge_price_data
    prompt: Take the CSV from Microsoft retrieval. Drop rows with missing Close values,
      convert Date to ISO format, and sort by Date ascending. Output a clean CSV with
      columns Date and Close_MSFT.
  compute_correlation:
    agent: false
    description: Compute correlation of MSFT and AAPL returns.
    name: compute_correlation
    nodes_depended_on:
    - calculate_daily_returns_microsoft
    - calculate_daily_returns_apple
    nodes_dependent_on:
    - generate_comparative_chart
    prompt: Calculate the Pearson correlation coefficient between Return_MSFT and
      Return_AAPL over the entire period. Return a single numeric value with a brief
      explanation.
  compute_sharpe_apple:
    agent: false
    description: Compute AAPL Sharpe ratio.
    name: compute_sharpe_apple
    nodes_depended_on:
    - calculate_daily_returns_apple
    nodes_dependent_on:
    - generate_comparative_chart
    prompt: Assume a risk‑free rate of 1.5% per annum. Compute the annualized Sharpe
      ratio for AAPL. Return the numeric value and a brief interpretation.
  compute_sharpe_microsoft:
    agent: false
    description: Compute MSFT Sharpe ratio.
    name: compute_sharpe_microsoft
    nodes_depended_on:
    - calculate_daily_returns_microsoft
    nodes_dependent_on:
    - generate_comparative_chart
    prompt: Assume a risk‑free rate of 1.5% per annum. Compute the annualized Sharpe
      ratio for MSFT (average annual return minus risk‑free rate divided by annualized
      volatility). Return the numeric value and a brief interpretation.
  compute_volatility_apple:
    agent: false
    description: Compute AAPL volatility.
    name: compute_volatility_apple
    nodes_depended_on:
    - calculate_daily_returns_apple
    nodes_dependent_on:
    - generate_comparative_chart
    prompt: Compute the annualized volatility (standard deviation of daily log returns
      multiplied by sqrt(252)) for AAPL. Return the numeric value and a short note.
  compute_volatility_microsoft:
    agent: false
    description: Compute MSFT volatility.
    name: compute_volatility_microsoft
    nodes_depended_on:
    - calculate_daily_returns_microsoft
    nodes_dependent_on:
    - generate_comparative_chart
    prompt: Compute the annualized volatility (standard deviation of daily log returns
      multiplied by sqrt(252)) for MSFT. Return the numeric value and a short note.
  generate_comparative_chart:
    agent: false
    description: Generate a comparative performance chart.
    name: generate_comparative_chart
    nodes_depended_on:
    - compute_correlation
    - compute_volatility_microsoft
    - compute_volatility_apple
    - compute_sharpe_microsoft
    - compute_sharpe_apple
    nodes_dependent_on:
    - produce_summary_report
    prompt: 'Create a single plot that shows: (1) a side‑by‑side bar chart of annualized
      volatility for MSFT and AAPL, (2) a side‑by‑side bar chart of Sharpe ratios,
      and (3) a scatter plot of daily returns with the correlation coefficient labeled.
      Output the chart in PNG format and a short description of key observations.'
  merge_price_data:
    agent: false
    description: Merge cleaned price data for MSFT and AAPL.
    name: merge_price_data
    nodes_depended_on:
    - clean_and_format_data_microsoft
    - clean_and_format_data_apple
    nodes_dependent_on:
    - calculate_daily_returns_microsoft
    - calculate_daily_returns_apple
    prompt: Merge the two cleaned CSVs on the Date column, keeping only dates present
      in both. Output a CSV with columns Date, Close_MSFT, Close_AAPL.
  produce_summary_report:
    agent: false
    description: Produce final summary report.
    name: produce_summary_report
    nodes_depended_on:
    - generate_comparative_chart
    nodes_dependent_on: []
    prompt: Write a concise report summarizing the comparison of MSFT and AAPL. Include
      the correlation coefficient, volatility figures, Sharpe ratios, and insights
      from the chart. Format as a Markdown document.
  retrieve_price_data_apple:
    agent: false
    description: Download 5 years of AAPL daily close prices.
    name: retrieve_price_data_apple
    nodes_depended_on: []
    nodes_dependent_on:
    - clean_and_format_data_apple
    prompt: 'Using a public financial data API, download daily closing price data
      for Apple (ticker: AAPL) from the most recent 5 years. Return a CSV with columns
      Date and Close.'
  retrieve_price_data_microsoft:
    agent: false
    description: Download 5 years of MSFT daily close prices.
    name: retrieve_price_data_microsoft
    nodes_depended_on: []
    nodes_dependent_on:
    - clean_and_format_data_microsoft
    prompt: 'Using a public financial data API, download daily closing price data
      for Microsoft (ticker: MSFT) from the most recent 5 years. Return a CSV with
      columns Date and Close.'

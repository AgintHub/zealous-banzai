dag_type: plain_text
description: Generated workflow from UI.
name: adaptive_elementary_math_mcq_flow
nodes:
  decide_lvl2:
    agent: false
    description: Adaptive difficulty selector for the second assessment item. It reads
      the correctness flag (`is_correct`) produced by the `eval_q1` node and adjusts
      the difficulty tier accordingly, ensuring the resulting level stays within the
      allowed bounds of 1 to 5. The baseline difficulty for the first item is level 1;
      a correct answer raises the level by one, while an incorrect answer lowers it
      by one.
    name: decide_lvl2
    nodes_depended_on:
    - eval_q1
    nodes_dependent_on: []
    prompt: '1. Retrieve the boolean field `is_correct` from the output of the `eval_q1`
      node.

      2. Let `current_level` be the difficulty tier of the first question (default = 1).

      3. If `is_correct` is **true**, compute `next_level = min(current_level + 1,
      5)`.

      4. If `is_correct` is **false**, compute `next_level = max(current_level - 1,
      1)`.

      5. Emit a JSON object exactly as follows:

      ```json

      { "next_level": <integer between 1 and 5> }

      ```'
  decide_lvl3:
    agent: false
    description: Select the difficulty level for the third question based on eval_q2.
    name: decide_lvl3
    nodes_depended_on:
    - eval_q2
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q2. If true, increase the current
      level by 1 (capped at 5). If false, decrease the current level by 1 (floored
      at 1). The current level is the one used for the second question (the value
      from decide_lvl2). Output a JSON object with "next_level" set to the new integer
      (1‑5).
  decide_lvl4:
    agent: false
    description: Select the difficulty level for the fourth question based on eval_q3.
    name: decide_lvl4
    nodes_depended_on:
    - eval_q3
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q3. If true, increase the current
      level by 1 (max 5). If false, decrease the current level by 1 (min 1). The current
      level is the one used for the third question (value from decide_lvl3). Output
      a JSON object with "next_level" set to the new integer.
  decide_lvl5:
    agent: false
    description: Select the difficulty level for the fifth (final) question based
      on eval_q4.
    name: decide_lvl5
    nodes_depended_on:
    - eval_q4
    nodes_dependent_on: []
    prompt: Read the "is_correct" flag from eval_q4. If true, increase the current
      level by 1 (max 5). If false, decrease the current level by 1 (min 1). The current
      level is the one used for the fourth question (value from decide_lvl4). Output
      a JSON object with "next_level" set to the new integer.
  eval_q1:
    agent: false
    description: Validates the learner's response to the first level‑1 multiple‑choice
      math question. It cross‑references the student's selected option (A‑D) with
      the correct option derived from the `present_q1_lvl1` node and emits a single
      Boolean flag indicating correctness.
    name: eval_q1
    nodes_depended_on:
    - present_q1_lvl1
    nodes_dependent_on: []
    prompt: 'You receive three pieces of information:

      1. **question** – the full text of the math problem presented to the student
      (including the four answer choices A‑D).

      2. **student_answer** – the option letter (A, B, C, or D) chosen by the student.

      3. **correct_answer** – the option letter (A, B, C, or D) that is the true answer,
      as identified by the `present_q1_lvl1` node.


      Your task is to determine whether the student''s choice matches the correct
      answer. Respond **only** with a JSON object containing a single field:

      ```json

      {"is_correct": true}

      ```

      if the answers match, or

      ```json

      {"is_correct": false}

      ```

      if they do not. Do not include any additional commentary, explanations, or fields.'
  eval_q2:
    agent: false
    description: Evaluate the student's answer for the second question and output
      a correctness flag.
    name: eval_q2
    nodes_depended_on:
    - present_q2_lvl1
    - present_q2_lvl2
    - present_q2_lvl3
    - present_q2_lvl4
    - present_q2_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from whichever present_q2_lvlX executed, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  eval_q3:
    agent: false
    description: Evaluate the student's answer for the third question and output a
      correctness flag.
    name: eval_q3
    nodes_depended_on:
    - present_q3_lvl1
    - present_q3_lvl2
    - present_q3_lvl3
    - present_q3_lvl4
    - present_q3_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from the executed present_q3_lvlX node, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  eval_q4:
    agent: false
    description: Evaluate the student's answer for the fourth question and output
      a correctness flag.
    name: eval_q4
    nodes_depended_on:
    - present_q4_lvl1
    - present_q4_lvl2
    - present_q4_lvl3
    - present_q4_lvl4
    - present_q4_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from the executed present_q4_lvlX node, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  eval_q5:
    agent: false
    description: Evaluate the student's answer for the final question and output a
      correctness flag.
    name: eval_q5
    nodes_depended_on:
    - present_q5_lvl1
    - present_q5_lvl2
    - present_q5_lvl3
    - present_q5_lvl4
    - present_q5_lvl5
    nodes_dependent_on: []
    prompt: 'Given the student''s selected option (A‑D) and the hidden correct option
      label from the executed present_q5_lvlX node, output a JSON object with "is_correct":
      true if they match, otherwise false.'
  gen_q_lvl1:
    agent: false
    description: Create one elementary‑math multiple‑choice question suitable for
      a beginner (level 1).
    name: gen_q_lvl1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'What is 2 + 3?

      {"question": "What is 2 + 3?", "correct_answer": "5", "wrong_answers": ["6",
      "4", "1"]} '
  gen_q_lvl2:
    agent: false
    description: Generates a single, well‑crafted multiple‑choice mathematics question
      suitable for a "Level 2" learner – a slightly harder beginner who has mastered
      basic addition/subtraction and is ready for introductory multiplication, division,
      simple fractions, and elementary algebra. The output is a JSON object containing
      the full question text, the correct answer, and three carefully chosen distractors
      that are plausible yet distinctly incorrect, supporting adaptive learning pathways
      and immediate automated feedback.
    name: gen_q_lvl2
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Create a Level 2 multiple‑choice math question. Use the following exemplar\
      \ as the template for the style and difficulty of the question you must generate:\n\
      \n**Example question:** \"What is 8 × 7?\"\n\nYour task is to produce a new\
      \ question of comparable difficulty (e.g., involving single‑digit multiplication,\
      \ simple division, basic fractions, or a one‑step algebraic expression). Provide\
      \ four answer options: one correct answer and three plausible wrong answers\
      \ that reflect common misconceptions at this stage. Return the result as a JSON\
      \ object with the exact fields:\n\n```json\n{\n  \"question\": \"<your generated\
      \ question>\",\n  \"correct_answer\": \"<the correct option>\",\n  \"wrong_answers\"\
      : [\"<distractor 1>\", \"<distractor 2>\", \"<distractor 3>\"]\n}\n```"
  gen_q_lvl3:
    agent: false
    description: Generates a single, high‑quality multiple‑choice math problem at
      moderate difficulty (Level 3). The output includes the question, one correct
      answer, and three credible wrong answers, all encapsulated in a structured JSON
      object ready for downstream consumption.
    name: gen_q_lvl3
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Create a single, well‑balanced multiple‑choice mathematics question that\
      \ exemplifies moderate difficulty (Level 3). The problem should require a single‑step\
      \ algebraic manipulation (e.g., solving for x, simplifying a rational expression,\
      \ or applying the Pythagorean theorem). Include:\n1. The full question text.\n\
      2. The correct answer.\n3. Three plausible but incorrect distractors.\nReturn\
      \ the result as a JSON object with the exact fields: \"question\", \"correct_answer\"\
      , and \"wrong_answers\" (an array of three strings). Ensure the language is\
      \ clear, the numeric values are reasonable for Level 3 learners, and the distractors\
      \ are realistic misconceptions.\n\nExample output format (the content must be\
      \ generated, not copied):\n```json\n{\n  \"question\": \"...\",\n  \"correct_answer\"\
      : \"...\",\n  \"wrong_answers\": [\"...\", \"...\", \"...\"]\n}\n```"
  gen_q_lvl4:
    agent: false
    description: Generates one high‑school‑prep (level 4) multiple‑choice math question,
      delivering the problem statement, the correct solution, and three carefully
      crafted incorrect options, all encapsulated in a structured JSON payload ready
      for downstream consumption.
    name: gen_q_lvl4
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a single, original multiple‑choice mathematics problem suitable
      for a student on the cusp of high school (difficulty level 4). The question
      should target a core pre‑high‑school topic such as linear equations, quadratic
      functions, geometry, or elementary probability, and be phrased clearly and concisely.


      Provide:

      1. **question** – the full problem statement.

      2. **correct_answer** – the exact solution.

      3. **wrong_answers** – an array of three plausible distractors that are numerically
      close or conceptually tempting.


      Return the output as a well‑formed JSON object with the keys "question", "correct_answer",
      and "wrong_answers" (the latter containing exactly three strings). Do not include
      any explanatory text outside the JSON.

      '
  gen_q_lvl5:
    agent: false
    description: Generate one multiple-choice question for the hardest elementary
      level (level 5), focusing on multi-step word problems involving multiplication,
      division, and basic financial calculations relevant to real-world scenarios.
    name: gen_q_lvl5
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Question: A farmer has 15 cows. Each cow produces 8 liters of milk per
      day. If the farmer sells the milk at $1.50 per liter, how much money will the
      farmer make in 5 days?

      Correct Answer: $900

      Wrong Answers: $600, $1800, $450


      Return a JSON object with fields: "question", "correct_answer", "wrong_answers".'
  init_flow:
    agent: false
    description: Start node that initializes the adaptive session (no action needed).
    name: init_flow
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Begin the adaptive quiz session. No output required; this node only signals
      the start of the workflow.
  present_q1_lvl1:
    agent: false
    description: Presents the level-1 math question generated in the previous step
      to the student in a multiple-choice format. The question and answer options
      are derived from the JSON output of the 'gen_q_lvl1' node. The correct answer
      is randomly positioned among the distractors, and the system internally notes
      the correct option for subsequent evaluation, without revealing it to the student.
    name: present_q1_lvl1
    nodes_depended_on:
    - init_flow
    - gen_q_lvl1
    nodes_dependent_on: []
    prompt: 'Here is your first question:


      Question: <question>

      A) <option_A>

      B) <option_B>

      C) <option_C>

      D) <option_D>


      To answer, select the letter corresponding to your choice.


      (Correct answer will be internally tracked as <correct_option>, but this is
      not revealed to the student.)'
  present_q2_lvl1:
    agent: false
    description: Displays a level‑1 elementary‑math multiple‑choice question for the
      second step of the workflow when the difficulty selector (`decide_lvl2`) determines
      that the next question should remain at level 1. The node consumes the JSON
      payload produced by `gen_q_lvl1`, formats it into a ready‑to‑present quiz prompt,
      and outputs the prompt together with a hidden label indicating which option
      is correct.
    name: present_q2_lvl1
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl1
    nodes_dependent_on: []
    prompt: "If the field `next_level` from the `decide_lvl2` node equals **1**, perform\
      \ the following actions:\n1. Retrieve the JSON object emitted by `gen_q_lvl1`.\
      \ It contains:\n   - `question`: the text of the math question (e.g., \"What\
      \ is 2 + 3?\")\n   - `correct_answer`: the correct answer string (e.g., \"5\"\
      )\n   - `wrong_answers`: an array of three plausible distractors (e.g., [\"\
      4\", \"6\", \"7\"]).\n2. Randomly assign the four answer choices to the labels\
      \ **A**, **B**, **C**, **D** while preserving the content order defined below\
      \ (you may shuffle if desired, but ensure the hidden label matches the final\
      \ position of the correct answer).\n3. Construct the multiple‑choice prompt\
      \ exactly in the style used by `present_q1_lvl1`. For example, with the sample\
      \ data above the formatted prompt should appear as:\n```\n**Question:** What\
      \ is 2 + 3?\nA) 4\nB) 6\nC) 7\nD) 5\n```\n4. Output **two** top‑level fields\
      \ in JSON:\n   - `prompt`: the fully formatted markdown string shown above (including\
      \ the question and the four labelled options).\n   - `correct_option`: the label\
      \ (A‑D) that corresponds to the correct answer (e.g., \"D\" for the example).\n\
      The output must be a valid JSON object with exactly these two fields.\n\n*Note:*\
      \ The actual question text and answer choices will vary according to the real\
      \ output of `gen_q_lvl1`; the example is provided solely for illustration."
  present_q2_lvl2:
    agent: false
    description: Formats the level‑2 math question produced by **gen_q_lvl2** for
      presentation to the learner. When **decide_lvl2** determines that the next difficulty
      level is 2, this node assembles the question text and four answer choices (A‑D),
      randomising the position of the correct answer, and emits both the user‑facing
      prompt and a hidden label indicating which option (A‑D) is correct for downstream
      grading.
    name: present_q2_lvl2
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl2
    nodes_dependent_on: []
    prompt: "If the JSON output from **decide_lvl2** contains `next_level` equal to\
      \ **2**, perform the following steps:\n\n1. Retrieve the JSON object from **gen_q_lvl2**,\
      \ which includes the fields:\n   - `question` (the math problem statement)\n\
      \   - `correct_answer` (the accurate solution)\n   - `wrong_answers` (an array\
      \ of three plausible distractors).\n2. Construct an array `all_answers` that\
      \ contains the `correct_answer` and the three `wrong_answers`.\n3. Randomly\
      \ shuffle `all_answers` and assign them to the labels **A**, **B**, **C**, **D**.\n\
      4. Determine which label now corresponds to the original `correct_answer`; store\
      \ this label as `correct_label`.\n5. Output **two** sections separated by a\
      \ blank line:\n   - **User Prompt**: the `question` followed by the four choices\
      \ formatted as:\n     ```\n     {question}\n     A) {answer_A}\n     B) {answer_B}\n\
      \     C) {answer_C}\n     D) {answer_D}\n     ```\n   - **Hidden Metadata**:\
      \ a JSON object on its own line containing the correct option label, e.g. `{\
      \ \"correct_label\": \"C\" }`.\n\nThe actual math question will be whatever\
      \ text is supplied by **gen_q_lvl2**; no placeholder text is used. The shuffling\
      \ ensures the correct answer appears at a random position each time the workflow\
      \ runs."
  present_q2_lvl3:
    agent: false
    description: When the adaptive difficulty controller (decide_lvl2) selects level 3
      for the second question, this node consumes the question payload generated by
      gen_q_lvl3 and transforms it into a polished, four‑option multiple‑choice prompt
      (options A‑D). The correct answer is randomly placed among the options, and
      the label of the correct option is emitted as hidden metadata for downstream
      evaluation. This ensures a seamless, level‑appropriate user experience while
      preserving the ability to automatically verify the response.
    name: present_q2_lvl3
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl3
    nodes_dependent_on: []
    prompt: "## Presentation Logic for a Level‑3 Question\n1. **Check Difficulty**:\
      \ Verify that `decide_lvl2.next_level` equals `3`. If not, produce no output.\n\
      2. **Retrieve Question Data**: From the output of `gen_q_lvl3` obtain the fields:\n\
      \   - `question` (string)\n   - `correct_answer` (string or number)\n   - `wrong_answers`\
      \ (array of three strings/numbers)\n3. **Shuffle Answers**: Combine the `correct_answer`\
      \ with the three `wrong_answers` and randomly shuffle the four items.\n4. **Assign\
      \ Labels**: Map the shuffled answers to option labels `A`, `B`, `C`, and `D`\
      \ in order.\n5. **Construct Prompt**: Build a user‑facing prompt in the following\
      \ format:\n```\n<question>\nA) <answer_A>\nB) <answer_B>\nC) <answer_C>\nD)\
      \ <answer_D>\n```\n   *Example* (for illustration only; the actual content comes\
      \ from `gen_q_lvl3`):\n```\nWhat is the sum of the interior angles of a regular\
      \ hexagon?\nA) 720°\nB) 540°\nC) 360°\nD) 180°\n```\n6. **Output JSON**: Return\
      \ a JSON object with two keys:\n   - `presented_prompt` (string): the formatted\
      \ multiple‑choice prompt.\n   - `correct_option` (string): the label (`A`, `B`,\
      \ `C`, or `D`) that corresponds to the correct answer after shuffling.\n\n**Important**:\
      \ The `correct_option` must be hidden from the user but available to downstream\
      \ nodes for answer validation.\n\n**Implementation Hint**: Use a deterministic\
      \ random seed derived from the current session ID to ensure reproducibility\
      \ if needed.\n\nReturn only the JSON object described above."
  present_q2_lvl4:
    agent: false
    description: Presents a level-4 (high school approaching difficulty) question
      for step 2. This node is triggered if decide_lvl2 determines that the next question
      should be level 4, based on the student's performance on question 1. It takes
      the generated question and answers from gen_q_lvl4 and formats them into a multiple-choice
      question with options A-D, ensuring the correct answer is randomly assigned
      to one of these options. The prompt and the correct answer's letter are then
      output.
    name: present_q2_lvl4
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl4
    nodes_dependent_on: []
    prompt: 'If decide_lvl2''s next_level equals 4, format the question from gen_q_lvl4
      as a multiple‑choice prompt (A‑D) with the correct answer randomly placed. For
      example, if the question is ''What is the derivative of f(x) = x^3?'', the correct
      answer is ''3x^2'', and the incorrect answers are ''x^2'', ''2x^3'', and ''4x'',
      the prompt should look like: ''What is the derivative of f(x) = x^3?\nA) x^2\nB)
      3x^2\nC) 2x^3\nD) 4x''. Randomly assign the correct answer to one of the options
      (A, B, C, or D). Output the complete prompt and the hidden correct option label
      (e.g., ''B'').'
  present_q2_lvl5:
    agent: false
    description: Presents a level 5 math question as a multiple-choice prompt for
      the second question in the sequence, formatted with options A-D, ensuring the
      correct answer is randomly positioned within these choices. Relies on the output
      of `decide_lvl2` to confirm the level is 5 and uses the question generated by
      `gen_q_lvl5`.
    name: present_q2_lvl5
    nodes_depended_on:
    - decide_lvl2
    - gen_q_lvl5
    nodes_dependent_on: []
    prompt: 'Here''s the level 5, multiple-choice question for step 2. \n\nWhat is
      the value of x in the following equation: 5(x + 3) = 35? \n\nA) 2 \nB) 4 \nC)
      7 \nD) 10 \n\nCorrect Answer: A'
  present_q3_lvl1:
    agent: false
    description: Formats and presents a level‑1 elementary‑math multiple‑choice question
      for the third interaction step, but only when the difficulty‑selection node
      (`decide_lvl3`) has determined that the next level is 1. The node pulls the
      question payload produced by `gen_q_lvl1`, randomises the ordering of the correct
      answer and the three distractors, labels the four options as A‑D, and returns
      a ready‑to‑display prompt together with the hidden label of the correct option
      for downstream evaluation.
    name: present_q3_lvl1
    nodes_depended_on:
    - decide_lvl3
    - gen_q_lvl1
    nodes_dependent_on: []
    prompt: "If the JSON field `decide_lvl3.next_level` equals 1, perform the following\
      \ actions:\n1. Retrieve the JSON object from `gen_q_lvl1` which contains:\n\
      \   - `question` (string)\n   - `correct_answer` (string)\n   - `wrong_answers`\
      \ (array of three strings)\n2. Build an array `all_answers` consisting of the\
      \ `correct_answer` and the three `wrong_answers`.\n3. Randomly shuffle `all_answers`.\n\
      4. Assign the shuffled answers to labels A, B, C, and D in order.\n5. Determine\
      \ which label corresponds to the original `correct_answer` and store it as `correct_label`.\n\
      6. Construct a formatted prompt string:\n```\n{question}\nA) {answer_A}\nB)\
      \ {answer_B}\nC) {answer_C}\nD) {answer_D}\n```\n7. Output a JSON object with\
      \ two fields:\n   - `prompt`: the formatted multiple‑choice string from step 6\n\
      \   - `correct_label`: the label (A‑D) that holds the correct answer (kept hidden\
      \ for scoring).\nIf `decide_lvl3.next_level` is not 1, output an empty JSON\
      \ object `{}`."
  present_q3_lvl2:
    agent: false
    description: Generates and presents a concrete level‑2 multiple‑choice math question
      for step 3 when the adaptive difficulty selector (decide_lvl3) chooses level 2.
      It consumes the JSON output of **gen_q_lvl2** (question, correct answer, and
      three distractors), randomises the order of the four answer choices, formats
      them as an A‑D markdown prompt, and returns both the formatted prompt and a
      hidden token indicating which option (A‑D) is the correct one. This ensures
      downstream nodes receive a ready‑to‑display question while preserving the answer
      key for evaluation.
    name: present_q3_lvl2
    nodes_depended_on:
    - decide_lvl3
    - gen_q_lvl2
    nodes_dependent_on: []
    prompt: "If the field `next_level` from the node **decide_lvl3** equals **2**,\
      \ perform the following steps:\n\n1. Retrieve the JSON object produced by **gen_q_lvl2**.\
      \ It contains:\n   - `question` (string)\n   - `correct_answer` (string)\n \
      \  - `wrong_answers` (array of three strings)\n2. Build an array `all_answers`\
      \ containing the `correct_answer` and the three `wrong_answers`.\n3. Randomly\
      \ shuffle `all_answers` and assign them to the labels **A**, **B**, **C**, **D**.\n\
      4. Identify which label now holds the original `correct_answer` and store this\
      \ label as `correct_option`.\n5. Construct a markdown formatted prompt:\n  \
      \ ```markdown\n   **Question:** {question}\n   \n   A) {answer_A}\n   B) {answer_B}\n\
      \   C) {answer_C}\n   D) {answer_D}\n   ```\n6. Output a JSON object with two\
      \ fields:\n   - `prompt`: the markdown string from step 5\n   - `correct_option`:\
      \ the label (A‑D) that corresponds to the correct answer.\n\nIf `next_level`\
      \ is not **2**, return an empty object or a message indicating that no level‑2\
      \ question is required for this step."
  present_q3_lvl3:
    agent: false
    description: 'Presents the level-3 question generated by gen_q_lvl3 if decide_lvl3
      determines the next level should be 3: Formats the question into a standard
      multiple-choice format (A-D) and randomly assigns the correct answer to one
      of the options. Stores the correct answer''s label for later evaluation.'
    name: present_q3_lvl3
    nodes_depended_on:
    - decide_lvl3
    - gen_q_lvl3
    nodes_dependent_on: []
    prompt: 'If decide_lvl3''s next_level equals 3, then format the level 3 math question
      from gen_q_lvl3 into a multiple-choice format with options A, B, C, and D. For
      example, the question could be: ''What is the area of a circle with a radius
      of 5?''. Ensure one of the options A-D is the correct answer and that the other
      three are plausible distractors. Randomly assign the correct answer to one of
      the option labels (A, B, C, or D). Output the formatted multiple-choice question
      and the hidden label (A, B, C, or D) of the correct option in JSON format, for
      example: {''question'': ''What is the area of a circle with a radius of 5?'',
      ''options'': {''A'': ''78.5'', ''B'': ''31.4'', ''C'': ''15.7'', ''D'': ''100''},
      ''correct_answer_label'': ''A''}.'
  present_q3_lvl4:
    agent: false
    description: When the adaptive difficulty engine (decide_lvl3) selects level 4
      for the third question, this node consumes the generated level‑4 question (gen_q_lvl4)
      and renders it as a polished, ready‑to‑display multiple‑choice item. It randomises
      the order of the four answer choices, assigns them the labels A‑D, and emits
      both the formatted prompt and a hidden answer key indicating which label holds

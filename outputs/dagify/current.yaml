dag_type: spec
description: Generated workflow from UI.
name: fda_device_submission_plan
nodes:
  address_fda_comments_and_questions:
    agent: false
    description: Verify that all comments and questions are resolved and that the
      submission meets the FDA's requirements.
    name: address_fda_comments_and_questions
    nodes_depended_on:
    - track_fda_review_progress
    nodes_dependent_on: []
    output_structure:
    - description: Indicates whether all FDA comments and questions have been fully
        resolved.
      key: resolved_all
      type: bool
    - description: List of identifiers or titles of the FDA comments and questions
        that have been resolved.
      key: resolved_comments
      type: str
    - description: Concise textual summary of how each resolved comment or question
        was addressed.
      key: resolution_summary
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use JSON parsing to read the 'pending_requests' array, then apply
          a regex or NLP tokenization to separate identifiers and titles; store results
          in a local list of dictionaries.
        reason: Provides a concrete, machine‑readable set of items to address, eliminating
          ambiguity in the resolution process.
        text: Extract the list of pending FDA comments and questions from the parent
          node 'track_fda_review_progress' output field 'pending_requests', mapping
          each entry to a structured object containing its identifier, title, and
          the associated query text.
      - complexity: MEDIUM
        impact: HIGH
        method: Maintain a mapping table of document IDs to file paths; query the
          table using the comment identifier, then load the document content (PDF/Word)
          via a document‑processing library (e.g., PyMuPDF, python-docx).
        reason: Ensures that the response is based on the most accurate and up‑to‑date
          information available in the submission documentation.
        text: For each extracted comment, locate the corresponding detailed query
          text within the submission package (e.g., design control files, testing
          reports) by cross‑referencing the identifier with document metadata stored
          in a central index.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Apply a templating engine (e.g., Jinja2) to inject extracted data
          into the response template; optionally use a summarization model (e.g.,
          T5) to condense long excerpts.
        reason: Provides a standardized response format that satisfies FDA expectations
          and facilitates downstream review.
        text: Generate a concise, FDA‑compliant response for each comment by summarizing
          the relevant section of the document and explicitly stating how the query
          is resolved, using a template that includes the comment identifier, the
          resolution statement, and any supporting evidence (e.g., page numbers, figure
          references).
      - complexity: LOW
        impact: MEDIUM
        method: Concatenate response strings with newline separators; enforce length
          constraints using a simple character count check.
        reason: Creates a coherent document that can be attached to the submission
          and read by FDA reviewers without needing to navigate multiple files.
        text: Aggregate all individual responses into a single resolution summary
          string, ensuring that each entry is clearly delineated (e.g., by comment
          ID) and that the overall summary adheres to the FDA's word‑limit guidelines.
      - complexity: LOW
        impact: MEDIUM
        method: 'Use an equality check: resolved_all = (len(resolved_comments) ==
          len(pending_requests)).'
        reason: Provides a clear, binary indicator for downstream nodes whether all
          issues have been addressed.
        text: Determine the 'resolved_all' boolean flag by comparing the count of
          resolved comments (length of 'resolved_comments' list) with the total number
          of pending comments extracted initially; set to true only if they match.
      - complexity: LOW
        impact: MEDIUM
        method: Serialize the data to JSON, then run a schema validation routine (e.g.,
          using jsonschema) to confirm type conformity.
        reason: Guarantees data integrity and compatibility with downstream nodes
          that consume this output.
        text: Write the output fields (resolved_all, resolved_comments, resolution_summary)
          to the node's output schema, ensuring proper data types (bool, list of strings,
          string) and validate against the schema before returning.
    prompt: Respond to any comments or questions raised by the FDA during the review
      process, ensuring that all queries are addressed promptly and thoroughly.
  clarify_device_type:
    agent: false
    description: Identify the appropriate device type, e.g., Class I, II, or III,
      and determine any specific regulations or requirements that apply.
    name: clarify_device_type
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The determined class of the device (e.g., Class I, Class II, Class
        III).
      key: device_class
      type: str
    - description: Short code representing the device class (I, II, or III).
      key: device_class_code
      type: str
    - description: List of specific FDA regulations, guidance documents, or requirements
        that apply to the device class.
      key: regulatory_requirements
      type: str
    - description: Confidence score (0‑1) that the classification is correct.
      key: classification_confidence
      type: float
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a data ingestion module that parses structured product specifications
          (JSON/XML) and validates required fields. Prompt the user for missing attributes
          via a guided questionnaire.
        reason: These attributes provide the foundational information needed to map
          the device to FDA risk categories and classification criteria.
        text: Collect all relevant device attributes (intended use, indications, technology,
          performance metrics, and risk factors) from the product data repository
          or user input forms.
      - complexity: MEDIUM
        impact: HIGH
        method: Create lookup tables that associate specific technology types, intended
          uses, and performance thresholds with risk levels. Apply a scoring algorithm
          that aggregates attribute scores to produce a single risk category.
        reason: Risk level directly influences the device class determination.
        text: Map the collected attributes to FDA risk categories (low, moderate,
          high) using the risk tables defined in 21 CFR Part 801.
      - complexity: LOW
        impact: HIGH
        method: 'Use straightforward conditional logic: if risk == ''low'' then class
          = ''Class I''; if risk == ''moderate'' then class = ''Class II''; else class
          = ''Class III''.'
        reason: Ensures the classification aligns with regulatory definitions.
        text: Determine the device class by cross‑referencing the risk category with
          FDA classification criteria (Class I for low risk, Class II for moderate
          risk, Class III for high risk).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Leverage the FDA Regulatory Information API or web‑scrape the FDA
          website to fetch relevant guidance titles and subpart references. Filter
          results by the identified class and store them as a list of strings.
        reason: Provides the downstream node with the exact compliance checklist needed
          for documentation and submission.
        text: Retrieve the specific regulatory requirements for the determined class
          by consulting FDA guidance documents, 21 CFR subparts, and pre‑market notification
          requirements (e.g., 510(k), PMA, De Novo).
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Implement a weighted scoring algorithm: assign points for each mandatory
          attribute present, deduct points for conflicts or missing data, and normalize
          to a 0‑1 scale.'
        reason: Offers an audit trail and helps downstream processes decide whether
          expert review is needed.
        text: Calculate a classification confidence score by evaluating data completeness,
          consistency with classification criteria, and presence of ambiguous attributes.
      - complexity: LOW
        impact: LOW
        method: Map internal variables to the output keys, convert the class code
          to its short form (I/II/III), and serialize the list of requirements as
          an array of strings.
        reason: Ensures the node’s contract is fulfilled and downstream nodes receive
          correctly typed data.
        text: Assemble the output fields (device_class, device_class_code, regulatory_requirements,
          classification_confidence) into the node’s expected JSON structure.
      - complexity: LOW
        impact: LOW
        method: Run unit tests that assert field types, required fields, and logical
          consistency. Log any validation failures for manual review.
        reason: Prevents data quality issues that could cascade through the DAG.
        text: Validate the assembled output against the defined schema and perform
          a cross‑check with the parent node’s expectations (e.g., ensure that regulatory_requirements
          are non‑empty for Class II/III).
    prompt: Determine the correct classification for the new device under the FDA's
      medical device regulations (21 CFR Part 801).
  develop_device_documentation:
    agent: false
    description: Prepare all necessary documents, such as design control files, testing
      reports, and labeling specifications, to support the device's FDA submission.
    name: develop_device_documentation
    nodes_depended_on:
    - research_fda_regulations
    - perform_competitive_analysis
    nodes_dependent_on: []
    output_structure:
    - description: List of design control file names or identifiers included in the
        documentation package.
      key: design_control_files
      type: List[str]
    - description: List of testing report titles or identifiers that demonstrate device
        performance and safety.
      key: testing_reports
      type: List[str]
    - description: List of labeling specification documents that outline device labeling
        requirements.
      key: labeling_specifications
      type: List[str]
    - description: Brief summary of how the documentation meets FDA regulatory requirements.
      key: regulatory_compliance_summary
      type: str
    - description: Flag indicating whether the documentation package is complete and
        ready for submission.
      key: submission_package_ready
      type: bool
    - description: Total count of documents included in the submission package.
      key: number_of_documents
      type: int
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Parse the required_documents list; create a mapping table; use a template
          engine to generate placeholder documents.
        reason: Ensures the documentation package aligns with FDA guidance and covers
          all mandatory document types.
        text: Extract required document categories from the regulatory requirements
          provided by research_fda_regulations (regulation_summary, guidance_documents,
          regulation_areas, compliance_checklist, required_documents). Map each required
          category to a concrete document type (e.g., Design History File, Risk Management
          Report, Software Verification Plan).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Cross‑reference differentiation_factors with design specifications;
          add sections in the Design History File documenting each unique feature.
        reason: Highlights device-specific innovations that are critical for regulatory
          justification and market positioning.
        text: Incorporate differentiation factors and competitor weaknesses from perform_competitive_analysis
          to identify unique design features that must be documented in the design
          control files (e.g., novel sensor architecture, proprietary software algorithm).
      - complexity: MEDIUM
        impact: HIGH
        method: Use a document generation library (e.g., Jinja2) to fill placeholders
          with data from the design database.
        reason: Provides traceability and ensures each design element is documented
          per regulatory expectations.
        text: Generate a structured list of design control files (design_control_files)
          using standardized FDA templates (e.g., 21 CFR Part 820 Design History File,
          ISO 14971 Risk Management File). Include file names, version numbers, and
          responsible personnel.
      - complexity: MEDIUM
        impact: HIGH
        method: Iterate over the compliance_checklist; for each checklist item, generate
          a report title and store in a list.
        reason: Facilitates easy navigation for reviewers and demonstrates compliance
          with verification/validation requirements.
        text: Create testing report titles (testing_reports) that correspond to each
          validation activity required by the regulatory checklist (e.g., Bench Validation
          Report, Clinical Study Report, Software Validation Report). Ensure each
          report title includes a unique identifier and links back to the relevant
          design control file.
      - complexity: MEDIUM
        impact: HIGH
        method: Create a labeling template; populate fields using data from the device
          description and regulatory guidance.
        reason: Labeling is a critical component of the submission; missing information
          can delay approval.
        text: Draft labeling specification documents (labeling_specifications) that
          cover device name, intended use, contraindications, warnings, instructions
          for use, and packaging details. Reference FDA labeling guidance (e.g., 21
          CFR Part 801) and ensure all required information is present.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use a mapping dictionary to link document types to requirement IDs;
          generate a narrative summary.
        reason: Provides a quick reference for reviewers and internal audit teams.
        text: Compile a regulatory compliance summary (regulatory_compliance_summary)
          that maps each document in design_control_files, testing_reports, and labeling_specifications
          to the specific FDA requirement or guidance it satisfies.
      - complexity: LOW
        impact: LOW
        method: Simple integer addition.
        reason: Ensures completeness and aids in package validation.
        text: Count the total number of documents (number_of_documents) by summing
          the lengths of design_control_files, testing_reports, and labeling_specifications
          lists.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a validation routine that checks presence of each required
          document type.
        reason: Prevents incomplete submissions and reduces the risk of rejections.
        text: Set the submission_package_ready flag (submission_package_ready) to
          true only after verifying that all required document categories identified
          in required_documents are present and that no required items are missing.
    prompt: Create a comprehensive documentation package for the new device, including
      design, testing, and labeling information.
  identify_required_fda_submissions:
    agent: false
    description: Identify the necessary submissions, including Pre-Submission communications,
      and prepare accordingly.
    name: identify_required_fda_submissions
    nodes_depended_on:
    - research_fda_regulations
    - develop_device_documentation
    nodes_dependent_on: []
    output_structure:
    - description: The type of FDA submission required (e.g., 510(k), PMA, De Novo).
      key: submission_type
      type: str
    - description: List of Pre-Submission communications or inquiries made to the
        FDA.
      key: pre_submission_communications
      type: str
    - description: List of documents required for the identified submission.
      key: required_documents
      type: str
    - description: Deadline date for completing the submission (ISO format).
      key: submission_deadline
      type: str
    - description: Whether the submission package has been fully prepared.
      key: is_submission_complete
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the regulation_areas and required_documents arrays from research_fda_regulations
          output; store them in temporary variables for downstream logic.
        reason: These fields directly indicate the permissible submission pathways
          and the baseline documentation set mandated by the FDA for the device class.
        text: Extract the list of regulation areas (e.g., '510(k)', 'PMA', 'De Novo')
          and the corresponding required documents from the output of research_fda_regulations.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Implement a decision matrix: if required_documents include ''510(k)
          premarket notification'' → submission_type = ''510(k)''; else if they include
          ''PMA premarket approval'' → submission_type = ''PMA''; else default to
          ''De Novo''.'
        reason: The device class dictates whether a 510(k), PMA, or De Novo route
          is applicable; selecting the correct type is critical for compliance.
        text: Determine the most appropriate submission_type by matching the device’s
          regulatory classification (implied by required_documents) with the regulation_areas
          list.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Execute a SQL/NoSQL query filtering by device identifier and submission_type;
          return a list of communication IDs or titles.
        reason: Pre‑submission communications are essential for clarifying submission
          requirements and can affect the required document set.
        text: Query the internal pre‑submission communication tracker (or a designated
          database) for any records of inquiries or feedback sent to the FDA prior
          to this node’s execution.
      - complexity: MEDIUM
        impact: HIGH
        method: Perform a set union operation on the three document lists; de‑duplicate
          by file name; output the combined list.
        reason: The final submission package must contain both regulatory‑mandated
          documents and device‑specific technical documents.
        text: Aggregate required_documents by merging the list from research_fda_regulations
          with the design_control_files, testing_reports, and labeling_specifications
          from develop_device_documentation.
      - complexity: LOW
        impact: MEDIUM
        method: Use a date‑library function to add 180 days to today’s date; format
          with ISO8601().
        reason: Providing a concrete deadline helps schedule downstream activities
          and ensures timely submission.
        text: Calculate the submission_deadline by adding the standard FDA review
          lead time (e.g., 180 days) to the current date, then format the result in
          ISO 8601 (YYYY-MM-DD).
      - complexity: MEDIUM
        impact: HIGH
        method: Iterate over required_documents; for each, verify existence via a
          file‑system or database lookup; compare current date to submission_deadline;
          set boolean accordingly.
        reason: This flag signals readiness for the next node (prepare_fda_submission_package)
          and prevents premature submission.
        text: Set is_submission_complete to true only if all documents in required_documents
          are present in the current repository and the current date is before submission_deadline.
    prompt: Determine the specific FDA submissions required for the device, e.g.,
      510(k) or PMA.
  obtain_fda_clearance_or_approval:
    agent: false
    description: Verify that the device has received the necessary clearance or approval,
      and obtain a copy of the approval letter or certificate.
    name: obtain_fda_clearance_or_approval
    nodes_depended_on:
    - address_fda_comments_and_questions
    nodes_dependent_on: []
    output_structure:
    - description: True if the device has received FDA clearance, False otherwise.
      key: clearance_status
      type: bool
    - description: File path or identifier of the received approval letter or certificate.
      key: approval_letter_path
      type: str
    - description: Date when the clearance or approval was granted (ISO format).
      key: approval_date
      type: str
    - description: Number of FDA comments or questions that were resolved before obtaining
        clearance.
      key: comments_resolved_count
      type: int
    - description: Number of FDA comments or questions still pending after clearance
        attempt.
      key: comments_pending_count
      type: int
    - description: Whether the clearance document is valid and meets FDA formatting
        requirements.
      key: clearance_document_valid
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the JSON output of 'address_fda_comments_and_questions', retrieve
          the boolean 'resolved_all', and store it in a local variable.
        reason: The parent node guarantees that all comments have been addressed;
          this flag determines whether the device is eligible for clearance.
        text: Extract the 'resolved_all' flag from the parent node's output and use
          it as the primary decision point for proceeding with clearance verification.
      - complexity: LOW
        impact: HIGH
        method: Conditional branching in the workflow engine; populate 'clearance_status'
          = False, set remaining keys to null, and emit an audit event.
        reason: No clearance can be granted until all comments are resolved; early
          exit prevents unnecessary processing.
        text: If 'resolved_all' is False, set 'clearance_status' to False, leave other
          fields empty or null, and log the failure reason for audit.
      - complexity: MEDIUM
        impact: HIGH
        method: Use FDA's public API or web‑scraping with authentication; construct
          a request with the device's 510(k) number or PMA ID; handle pagination and
          JSON/XML responses.
        reason: The clearance letter is the primary source of official confirmation
          and contains the approval date.
        text: If 'resolved_all' is True, query the FDA's electronic submission portal
          (e.g., FDA's 510(k) database) using the device's unique identifier to locate
          the clearance letter.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use secure file transfer (SFTP/HTTPS), generate a UUID for the file
          name, store metadata (timestamp, checksum) in a database, and assign the
          repository path to the output field.
        reason: A persistent, indexed copy is required for compliance audits and future
          reference.
        text: Download the clearance letter PDF, store it in the secure document repository,
          and record the file path in 'approval_letter_path'.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Parse PDF with a library like PyPDF2 or pdfminer; locate date patterns
          using regex; convert to ISO format; validate against a calendar.
        reason: The approval date is a critical compliance attribute and must be machine‑readable.
        text: Extract the approval date from the letter's metadata (e.g., PDF 'CreationDate'
          or a structured table) and format it as ISO 8601; assign to 'approval_date'.
      - complexity: LOW
        impact: MEDIUM
        method: Retrieve 'resolved_comments' list, compute len(), store in the output
          field.
        reason: Provides a quantitative metric of how many issues were addressed before
          clearance.
        text: Count the number of resolved comments by summing the length of 'resolved_comments'
          from the parent output; assign to 'comments_resolved_count'.
      - complexity: LOW
        impact: MEDIUM
        method: Retrieve total comments count from parent (e.g., length of 'resolved_comments'
          + pending list), compute difference.
        reason: Ensures that any remaining comments are tracked for future action.
        text: Determine 'comments_pending_count' by subtracting 'comments_resolved_count'
          from the total number of FDA comments recorded in the parent output; assign
          to the field.
      - complexity: MEDIUM
        impact: HIGH
        method: Run PDF/A validation using veraPDF, check for mandatory fields via
          OCR or text extraction, and flag any deviations.
        reason: Non‑compliant documents can invalidate the clearance status and trigger
          re‑submission.
        text: Validate the clearance document against FDA formatting requirements
          (e.g., PDF/A compliance, presence of required sections like 'Device Name',
          'Approval Number'); set 'clearance_document_valid' accordingly.
      - complexity: LOW
        impact: HIGH
        method: Serialize the output object to JSON, enforce schema validation, and
          attach a UTC timestamp.
        reason: A well‑structured output is required for downstream nodes and regulatory
          reporting.
        text: Aggregate all populated fields into the final output JSON, ensuring
          type consistency (bool, str, int) and include an audit trail timestamp for
          traceability.
    prompt: Await FDA clearance or approval and document the outcome of the review
      process.
  perform_competitive_analysis:
    agent: false
    description: Conduct a competitive analysis to understand the market and regulatory
      environment for the device.
    name: perform_competitive_analysis
    nodes_depended_on:
    - research_fda_regulations
    nodes_dependent_on: []
    output_structure:
    - description: Names of comparable medical devices in the market.
      key: competitor_names
      type: List[str]
    - description: Estimated market share percentage for each competitor.
      key: market_share_percent
      type: List[float]
    - description: Regulatory pathway status for each competitor (e.g., 510(k), PMA,
        De Novo).
      key: regulatory_status
      type: List[str]
    - description: Key factors where the device differs from competitors (e.g., technology,
        cost, performance).
      key: differentiation_factors
      type: List[str]
    - description: Summary bullet points of strengths and weaknesses of each competitor.
      key: strengths_weaknesses
      type: List[str]
    - description: Concise summary of the competitive analysis highlighting strategic
        insights.
      key: analysis_summary
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use FDA’s 510(k) database, PMA database, and De Novo database; filter
          by product code, indication, and technology classification; export results
          to a CSV.
        reason: Ensures the analysis covers the complete competitive set relevant
          to the device’s regulatory pathway.
        text: Gather a list of all FDA‑registered medical devices that serve the same
          clinical indication and share similar technology or intended use.
      - complexity: LOW
        impact: MEDIUM
        method: 'Apply Python pandas to read CSV, rename columns, and handle missing
          values; output DataFrame with columns: Name, RegStatus.'
        reason: Provides a clean, machine‑readable format for downstream calculations
          and reporting.
        text: Parse the exported CSV to extract competitor names, product codes, and
          regulatory status, and store them in structured data frames.
      - complexity: MEDIUM
        impact: HIGH
        method: Scrape sales data, clean and merge with competitor list; compute share
          = (competitor sales / total market sales) * 100; round to two decimals.
        reason: Quantifies each competitor’s market footprint, which is critical for
          strategic positioning.
        text: Calculate the market share percentage for each competitor by aggregating
          sales data from publicly available sources (e.g., IQVIA, FDA reports) and
          normalizing against total market sales.
      - complexity: LOW
        impact: MEDIUM
        method: Create a lookup dictionary from research_fda_regulations; apply to
          competitor DataFrame; store results in the regulatory_status list.
        reason: Aligns market analysis with regulatory constraints, ensuring compliance
          considerations are integrated.
        text: Map each competitor’s regulatory status to the appropriate pathway (510(k),
          PMA, De Novo) using FDA’s classification tables and cross‑reference with
          the research_fda_regulations output.
      - complexity: HIGH
        impact: HIGH
        method: Extract feature sets from product datasheets and regulatory submissions;
          use set operations to compute differences; generate descriptive strings
          for each factor.
        reason: Highlights unique selling propositions that can be leveraged in the
          submission and marketing.
        text: Identify differentiation factors by comparing the device’s technical
          specifications (e.g., sensor type, algorithmic processing, cost) against
          each competitor’s documented features.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Parse clearance letters for performance metrics; extract adverse event
          statistics; create bullet points using natural language generation templates.
        reason: Provides a balanced view of the competitive landscape, informing risk
          mitigation and product development.
        text: Summarize strengths and weaknesses for each competitor by reviewing
          FDA clearance letters, clinical study results, and post‑market surveillance
          data.
      - complexity: MEDIUM
        impact: HIGH
        method: Aggregate key findings into a structured paragraph; include tables
          or charts for visual emphasis; ensure alignment with the device’s regulatory
          strategy.
        reason: Delivers a high‑level narrative that can be used by stakeholders to
          make informed decisions.
        text: Draft a concise analysis summary that synthesizes market share trends,
          regulatory environment, and differentiation insights into strategic recommendations
          for the device.
      - complexity: LOW
        impact: MEDIUM
        method: Implement unit tests that check each field’s type and presence; run
          a validation script before exporting results.
        reason: Guarantees that downstream nodes receive correctly formatted data,
          preventing integration errors.
        text: Validate the final output fields against the defined output structure,
          ensuring type consistency (List[str], List[float], str) and completeness.
    prompt: Analyze the competitive landscape of similar medical devices and identify
      areas for differentiation.
  prepare_fda_submission_package:
    agent: false
    description: Ensure that the package includes all required information, e.g.,
      device description, technical specifications, and clinical data.
    name: prepare_fda_submission_package
    nodes_depended_on:
    - identify_required_fda_submissions
    - develop_device_documentation
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the submission package.
      key: package_id
      type: str
    - description: Summary of the device description.
      key: device_description
      type: str
    - description: Technical specifications of the device.
      key: technical_specifications
      type: str
    - description: Summary of clinical data included.
      key: clinical_data_summary
      type: str
    - description: List of required document filenames or titles.
      key: required_documents
      type: str
    - description: Whether the package complies with the FDA submission format.
      key: format_compliant
      type: bool
    - description: Total number of pages in the package.
      key: total_pages
      type: int
    - description: Current status of the package (e.g., ready, pending).
      key: submission_status
      type: str
    - description: Timestamp when the package was assembled.
      key: submission_timestamp
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use a UUID v4 generator combined with a deterministic prefix; store
          and increment the counter in a thread‑safe database table.
        reason: Ensures traceability and prevents collisions across multiple submissions.
        text: Generate a globally unique package_id by concatenating the device_class_code
          from identify_required_fda_submissions, current ISO 8601 date, and a sequential
          counter stored in a central registry.
      - complexity: LOW
        impact: MEDIUM
        method: Apply a natural language summarization model (e.g., T5 fine‑tuned
          on regulatory texts) to the concatenated design control file contents.
        reason: Provides a clear, FDA‑acceptable overview required for the submission
          package.
        text: Extract the device_description from the device_control_files list in
          develop_device_documentation, summarizing the device name, intended use,
          and key features into a concise paragraph.
      - complexity: MEDIUM
        impact: HIGH
        method: Parse each report using a PDF extraction library, normalize data into
          JSON, then render to Markdown/HTML using a templating engine.
        reason: Ensures that all performance and safety data are presented in a structured,
          compliant manner.
        text: Compile technical_specifications by aggregating all testing_reports
          and labeling_specifications from develop_device_documentation, formatting
          each as a separate section with tables and figures as per FDA guidance.
      - complexity: MEDIUM
        impact: HIGH
        method: Use a domain‑specific NLP pipeline to extract study metadata, then
          produce a one‑page summary with bullet points.
        reason: Clinical data is a mandatory component for most FDA submissions; a
          concise summary facilitates reviewer understanding.
        text: Generate clinical_data_summary by summarizing the clinical study reports
          referenced in identify_required_fda_submissions, extracting key endpoints,
          sample sizes, and statistical significance.
      - complexity: LOW
        impact: MEDIUM
        method: Implement a set union operation in Python, then output as a List[str].
        reason: Provides a definitive inventory of all files that must accompany the
          submission.
        text: Create the required_documents list by merging the required_documents
          from identify_required_fda_submissions with all filenames from design_control_files,
          testing_reports, and labeling_specifications, then de‑duplicate and sort
          alphabetically.
      - complexity: MEDIUM
        impact: HIGH
        method: Leverage open‑source validators (e.g., SDTM Validator) and aggregate
          results.
        reason: Ensures the package meets technical submission requirements, avoiding
          delays.
        text: Validate format_compliant by checking each document against the FDA's
          electronic submission format (e.g., CDISC SDTM, DICOM) using a schema validator;
          set format_compliant to true only if all documents pass.
      - complexity: LOW
        impact: LOW
        method: Use a PDF library (e.g., PyPDF2) to open the generated file and read
          the page count.
        reason: Page count is often required for submission cost estimation and compliance
          checks.
        text: Calculate total_pages by rendering the assembled document to PDF and
          counting pages, then store the integer value.
      - complexity: LOW
        impact: MEDIUM
        method: Implement a conditional assignment in the final assembly script.
        reason: Provides a clear indicator for downstream nodes (submit_fda_application)
          to act upon.
        text: Set submission_status to 'ready' if format_compliant is true and total_pages
          > 0; otherwise, set to 'pending' and log missing components.
      - complexity: LOW
        impact: LOW
        method: Use Python's datetime.utcnow().isoformat() + 'Z' for UTC.
        reason: Timestamping is essential for audit trails and regulatory timelines.
        text: Record submission_timestamp as the current UTC time in ISO 8601 format
          at the moment the package is finalized.
    prompt: Assemble all necessary documents and information into a submission package
      for the FDA, following the specified format.
  research_fda_regulations:
    agent: false
    description: Review the FDA's Code of Federal Regulations, Guidance Documents,
      and other relevant resources to ensure compliance.
    name: research_fda_regulations
    nodes_depended_on:
    - clarify_device_type
    nodes_dependent_on: []
    output_structure:
    - description: Concise summary of the most relevant FDA regulations for the device.
      key: regulation_summary
      type: str
    - description: List of guidance document titles or identifiers that apply to the
        device.
      key: guidance_documents
      type: str
    - description: List of regulation areas (e.g., "510(k)", "PMA", "De Novo") relevant
        to the device.
      key: regulation_areas
      type: str
    - description: Checklist items that must be verified for regulatory compliance.
      key: compliance_checklist
      type: str
    - description: Version numbers or effective dates of the regulations and guidance
        documents.
      key: regulation_versions
      type: str
    - description: Preliminary assessment of whether the device meets the identified
        regulatory requirements.
      key: is_compliant
      type: bool
    - description: List of documents that must be prepared for FDA submission.
      key: required_documents
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Parse the clarify_device_type JSON; map class to pathway using a static
          lookup table.
        reason: The regulatory pathway is the foundation for all subsequent regulation
          and guidance document selection.
        text: Extract the device class and class code from the clarify_device_type
          output (device_class and device_class_code) to determine the primary regulatory
          pathway (e.g., Class I → 510(k), Class III → PMA).
      - complexity: MEDIUM
        impact: HIGH
        method: Use a rule‑based engine to cross‑reference device class and feature
          flags against a curated CFR part matrix.
        reason: CFR parts define the statutory requirements that must be satisfied.
        text: Identify the relevant CFR parts (e.g., 21 CFR Part 820 for quality systems,
          21 CFR Part 820 for medical device reporting) based on the device class
          and any special features indicated in regulatory_requirements.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Implement a keyword‑matching algorithm that searches titles, abstracts,
          and document IDs; retrieve metadata (title, effective date, version).
        reason: Guidance documents provide clarifications, best practices, and implementation
          examples.
        text: Query the FDA Guidance Documents database (or an internal repository)
          for guidance documents whose titles or identifiers match the identified
          CFR parts and device class.
      - complexity: LOW
        impact: MEDIUM
        method: Normalize the document metadata into a standard JSON array.
        reason: A structured list enables downstream nodes to reference the correct
          documents.
        text: Aggregate the retrieved guidance documents into the guidance_documents
          list, ensuring each entry includes a unique identifier (e.g., GUID or FDA
          document number).
      - complexity: MEDIUM
        impact: HIGH
        method: Apply a summarization model (e.g., T5 or GPT‑4) fine‑tuned on regulatory
          texts; limit to 150‑200 words.
        reason: The summary provides a quick reference for compliance checks.
        text: Construct a concise regulation_summary by summarizing the statutory
          requirements from the identified CFR parts and highlighting key obligations
          (e.g., premarket submission, quality system, labeling).
      - complexity: LOW
        impact: MEDIUM
        method: Map CFR part identifiers to pathway names using a predefined dictionary.
        reason: Regulation areas guide the selection of submission types and required
          documents.
        text: Create the regulation_areas list by extracting the names of regulatory
          pathways (e.g., "510(k)", "PMA", "De Novo") that are relevant to the device
          based on class and guidance documents.
      - complexity: MEDIUM
        impact: HIGH
        method: Generate checklist items via a rule‑based template engine; include
          references to specific CFR sections.
        reason: A checklist ensures no regulatory requirement is omitted.
        text: Develop a compliance_checklist that enumerates mandatory actions (e.g.,
          "Prepare 510(k) summary", "Submit premarket notification", "Establish quality
          system") derived from the CFR parts and guidance documents.
      - complexity: LOW
        impact: MEDIUM
        method: Parse metadata fields from the guidance document repository; format
          as "CFR Part 820 (Effective 2023-01-01)".
        reason: Regulatory versions affect compliance deadlines and scope.
        text: Extract version numbers and effective dates for each CFR part and guidance
          document to populate regulation_versions.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a boolean expression that evaluates the presence of each
          checklist item in the current project status repository.
        reason: A preliminary compliance flag informs risk assessment.
        text: Determine is_compliant by cross‑checking that all required regulatory
          actions (as listed in compliance_checklist) are either already satisfied
          (e.g., prior FDA clearance) or planned within the submission timeline.
      - complexity: MEDIUM
        impact: HIGH
        method: Map each regulation area to its document requirements using a regulatory
          requirement matrix; deduplicate entries.
        reason: This list directly feeds into the submission package.
        text: Compile required_documents by aggregating all documents mandated by
          the identified CFR parts and guidance documents (e.g., "Device Description",
          "Design History File", "Risk Analysis", "Labeling Specification").
    prompt: Research all relevant FDA regulations, guidelines, and requirements for
      the specific device type identified.
  submit_fda_application:
    agent: false
    description: Verify that the submission is complete and accurately reflects the
      device's information, then transmit the FDA application package using the FDA’s
      electronic submission portal or other approved method.
    name: submit_fda_application
    nodes_depended_on:
    - prepare_fda_submission_package
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier for the FDA submission
      key: submission_id
      type: str
    - description: Current status of the submission (e.g., 'Pending', 'Submitted',
        'Approved')
      key: submission_status
      type: str
    - description: List of document names included in the submission package
      key: documents_submitted
      type: str
    - description: Date the submission was made (ISO 8601 format)
      key: submission_date
      type: str
    - description: Whether the submission was successfully transmitted without errors
      key: success_flag
      type: bool
    - description: Whether a response or request for additional information has been
        received from the FDA
      key: review_response_received
      type: bool
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use a JSON schema validator to map parent fields to API fields; include
          error handling for missing or mismatched fields.
        reason: Ensures that the submission payload contains all mandatory information
          in the format expected by the FDA portal.
        text: Extract the prepared submission package data from the parent node output,
          mapping each required field (package_id, device_description, technical_specifications,
          clinical_data_summary, required_documents, format_compliant, total_pages)
          into a structured payload for the FDA submission API.
      - complexity: LOW
        impact: MEDIUM
        method: Invoke a UUID library (e.g., uuid4 in Python) and embed the value
          in the submission payload.
        reason: Provides a reliable reference for downstream tracking and audit purposes.
        text: Generate a globally unique submission_id using a UUIDv4 generator and
          store it alongside the payload for traceability.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a conditional check; if false, set success_flag to false,
          submission_status to 'Failed', and return an early response.
        reason: Prevents transmitting incomplete or non‑compliant packages that would
          be rejected by the FDA, saving time and resources.
        text: Validate the format_compliant flag from the parent node; if false, abort
          submission and log a detailed error message indicating which format requirements
          were not met.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use a standard OAuth2 library to request a token from the FDA token
          endpoint; cache the token until expiration.
        reason: Securely obtains the necessary token to authorize the submission request.
        text: Authenticate with the FDA submission portal using OAuth2 client credentials
          flow, retrieving an access token scoped for the 'submit' endpoint.
      - complexity: HIGH
        impact: HIGH
        method: Construct a multipart/form-data request; attach each document from
          required_documents as a separate part; set appropriate content‑disposition
          headers.
        reason: Ensures that the submission is transmitted in the correct protocol
          and format required by the FDA.
        text: Send the submission payload via HTTPS POST to the FDA’s electronic submission
          endpoint, including the access token in the Authorization header and all
          documents as multipart/form-data attachments.
      - complexity: MEDIUM
        impact: HIGH
        method: Use a JSON parser to extract fields; implement retry logic for transient
          network errors.
        reason: Provides a reliable way to confirm successful transmission and retrieve
          the FDA‑assigned submission identifier.
        text: Parse the FDA response; if the HTTP status code is 200 OK and the JSON
          body contains a 'submission_id' and 'status', map these to the output fields;
          otherwise, set success_flag to false and capture the error message.
      - complexity: LOW
        impact: MEDIUM
        method: Use a datetime library to generate the timestamp.
        reason: Creates an audit trail and enables downstream nodes to track the submission
          timeline.
        text: Record the current timestamp in ISO 8601 format as submission_date and
          set submission_status to the status received from the FDA (e.g., 'Submitted').
      - complexity: LOW
        impact: MEDIUM
        method: Simple boolean mapping from response field.
        reason: Allows the system to know whether immediate follow‑up is required.
        text: Determine review_response_received by checking if the FDA response includes
          a 'request_for_additional_info' flag; set to true if present, otherwise
          false.
      - complexity: MEDIUM
        impact: HIGH
        method: Use an ORM or direct SQL INSERT; enforce foreign key constraint on
          package_id.
        reason: Ensures that downstream nodes (e.g., track_fda_review_progress) can
          retrieve the submission metadata.
        text: Persist all output fields (submission_id, submission_status, documents_submitted,
          submission_date, success_flag, review_response_received) to the central
          workflow database, linking them to the parent package_id for traceability.
      - complexity: MEDIUM
        impact: HIGH
        method: Integrate with the company's incident management system (e.g., ServiceNow)
          via webhook.
        reason: Prevents cascading failures and ensures that the submission is corrected
          before re‑submission.
        text: If success_flag is false, generate an alert to the compliance team with
          details of the failure (e.g., missing documents, authentication error) and
          halt further progression until resolved.
    prompt: Submit the completed FDA application package, including all required documents
      and information, via the specified submission method.
  track_fda_review_progress:
    agent: false
    description: Track the review progress, including any updates or changes to the
      review timeline.
    name: track_fda_review_progress
    nodes_depended_on:
    - submit_fda_application
    nodes_dependent_on: []
    output_structure:
    - description: Current status of the FDA review, e.g., 'Pending', 'In Review',
        'Completed'.
      key: review_status
      type: str
    - description: Estimated number of days remaining until the review is concluded.
      key: timeline_estimate_days
      type: int
    - description: List of any FDA requests for additional information or clarification
        that are still pending.
      key: pending_requests
      type: str
    - description: ISO 8601 timestamp of the most recent review status update.
      key: last_update_timestamp
      type: str
    - description: Whether all pending FDA requests have been responded to.
      key: responded_to_requests
      type: bool
    - description: Brief summary of the responses submitted to the FDA.
      key: response_summary
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use OAuth2‑protected REST endpoint to fetch submission record; validate
          success_flag before proceeding.
        reason: The submission identifier and date are required to query the FDA review
          status and to calculate elapsed time for timeline estimation.
        text: 1️⃣ Retrieve the submission metadata (submission_id, submission_date,
          success_flag, review_response_received) from the output of submit_fda_application
          using a secure API call or database query.
      - complexity: MEDIUM
        impact: HIGH
        method: Send GET request to ESG /status/{submission_id}; parse JSON response;
          map FDA status codes to 'Pending', 'In Review', 'Completed'.
        reason: FDA provides a structured response that maps to our review_status
          field and lists pending information requests.
        text: 2️⃣ Query the FDA Electronic Submissions Gateway (ESG) or equivalent
          API endpoint with the submission_id to obtain the current review status
          code and any pending request objects.
      - complexity: LOW
        impact: MEDIUM
        method: Use Python datetime library to compute days_since_submission = (current_date
          - submission_date).days; timeline_estimate_days = max(0, standard_period
          - days_since_submission).
        reason: Provides a realistic estimate for stakeholders and helps trigger timely
          follow‑ups.
        text: 3️⃣ Calculate timeline_estimate_days by subtracting the number of days
          elapsed since submission_date from the standard review period for the device
          class (e.g., 180 days for 510(k)).
      - complexity: LOW
        impact: MEDIUM
        method: Map each request object to its 'request_id' field; validate against
          a regex pattern; collect into a list.
        reason: Ensures that all FDA requests are captured for tracking and future
          response handling.
        text: 4️⃣ Extract pending_requests by iterating over the FDA response payload’s
          request list, normalizing each entry to a concise identifier (e.g., 'REQ-2025-001')
          and storing them in a List[str].
      - complexity: LOW
        impact: LOW
        method: Use datetime.utcnow().isoformat() + 'Z' to generate the timestamp.
        reason: Provides an audit trail for when the review information was last verified.
        text: 5️⃣ Record last_update_timestamp as the current UTC time in ISO 8601
          format at the moment the FDA status is retrieved.
      - complexity: LOW
        impact: MEDIUM
        method: Set responded_to_requests = (len(pending_requests) == 0) after initial
          poll; update flag after response submission.
        reason: Tracks whether the FDA has received all required information, which
          influences downstream nodes.
        text: 6️⃣ Determine responded_to_requests by checking if any pending_requests
          remain after any response handling logic (initially set to False; later
          updated when responses are submitted).
      - complexity: LOW
        impact: LOW
        method: 'If review_response_received: response_summary = f''{response_count}
          responses submitted, awaiting FDA review.''; else response_summary = ''No
          responses submitted yet.'''
        reason: Summarizes the current state of communication with the FDA for quick
          reference.
        text: 7️⃣ Generate response_summary by concatenating the count of responses
          sent (if review_response_received is True) and a brief status message, e.g.,
          '2 responses submitted, awaiting FDA review.'
      - complexity: MEDIUM
        impact: HIGH
        method: Use a data class or schema validation library (e.g., Pydantic) to
          enforce types; serialize with json.dumps().
        reason: Guarantees that the node's contract is satisfied and that downstream
          nodes receive correctly typed data.
        text: 8️⃣ Assemble all derived values into the output structure, ensuring
          type integrity (str, int, bool, List[str]), and serialize to JSON for downstream
          consumption.
    prompt: Monitor the status of the FDA's review and respond to any requests for
      additional information or clarification.

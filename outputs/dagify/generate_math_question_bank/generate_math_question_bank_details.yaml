dag_type: plain_text
description: Create a bank of elementary school math questions across five difficulty
  levels.
name: generate_math_question_bank
nodes:
  compile_question_bank:
    agent: false
    description: Assemble the complete question bank.
    name: compile_question_bank
    nodes_depended_on:
    - generate_level_1_questions
    - generate_level_2_questions
    - generate_level_3_questions
    - generate_level_4_questions
    - generate_level_5_questions
    nodes_dependent_on: []
    prompt: Combine all generated questions from the five levels into a single question
      bank, preserving each question’s level designation.
  define_math_topic_areas:
    agent: false
    description: Identify the core math topics to be covered in the questions.
    name: define_math_topic_areas
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List five key elementary school math topic areas (e.g., addition, subtraction,
      multiplication, division, fractions).
  generate_level_1_questions:
    agent: false
    description: Create level 1 questions.
    name: generate_level_1_questions
    nodes_depended_on:
    - define_math_topic_areas
    nodes_dependent_on: []
    prompt: Generate 5 multiple‑choice questions for level 1 with 1 correct and 3
      incorrect options, covering the identified topics and suitable for elementary
      students.
  generate_level_2_questions:
    agent: false
    description: Create level 2 questions.
    name: generate_level_2_questions
    nodes_depended_on:
    - define_math_topic_areas
    nodes_dependent_on: []
    prompt: Generate 5 multiple‑choice questions for level 2 with 1 correct and 3
      incorrect options, covering the identified topics and slightly harder than level 1.
  generate_level_3_questions:
    agent: false
    description: Create level 3 questions.
    name: generate_level_3_questions
    nodes_depended_on:
    - define_math_topic_areas
    nodes_dependent_on: []
    prompt: Generate 5 multiple‑choice questions for level 3 with 1 correct and 3
      incorrect options, covering the identified topics and harder than level 2.
  generate_level_4_questions:
    agent: false
    description: Create level 4 questions.
    name: generate_level_4_questions
    nodes_depended_on:
    - define_math_topic_areas
    nodes_dependent_on: []
    prompt: Generate 5 multiple‑choice questions for level 4 with 1 correct and 3
      incorrect options, covering the identified topics and harder than level 3.
  generate_level_5_questions:
    agent: false
    description: Create level 5 questions.
    name: generate_level_5_questions
    nodes_depended_on:
    - define_math_topic_areas
    nodes_dependent_on: []
    prompt: Generate 5 multiple‑choice questions for level 5 with 1 correct and 3
      incorrect options, covering the identified topics and hardest among all levels.
